spring.application.name=demo-integracao-mongodb

# Usando a URI de conexão (o nome do banco fica no final, antes dos parâmetros)
spring.data.mongodb.uri=mongodb://localhost:27017/escola

# Se no futuro precisares de adicionar autenticação (utilizador e senha) com a URI, o formato é este:
# spring.data.mongodb.uri=mongodb://admin:password@localhost:27017/escola